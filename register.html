<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Register - Alumni Management System</title>

    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/style.css">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <!-- Navigation Bar -->
    <header>

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

            <div class="container">

                <a class="navbar-brand" href="index.html">
                    Alumni System
                </a>

                <div class="navbar-nav ms-auto">

                    <a class="nav-link" href="index.html">
                        Home
                    </a>

                    <a class="nav-link" href="login.html">
                        Login
                    </a>

                    <a class="nav-link active" href="register.html">
                        Register
                    </a>

                </div>

            </div>

        </nav>

    </header>


    <!-- Main Content -->
    <main class="container my-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-7">

                <!-- Registration Card -->
                <section class="card shadow-sm">

                    <div class="card-body p-4">

                        <h2 class="card-title text-center mb-3">
                            Create Alumni Account
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Register as an alumnus to become part of our
                            university alumni community.
                        </p>


                        <!-- Registration Form -->
                        <form>

                            <!-- Full Name -->
                            <div class="mb-3">

                                <label for="fullName" class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="fullName"
                                    name="fullName"
                                    placeholder="Enter your full name"
                                    required>

                            </div>


                            <!-- Email -->
                            <div class="mb-3">

                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="Enter your email"
                                    required>

                            </div>


                            <!-- Password -->
                            <div class="mb-3">

                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    placeholder="Create a password"
                                    required>

                            </div>


                            <!-- Graduation Year -->
                            <div class="mb-3">

                                <label for="graduationYear" class="form-label">
                                    Graduation Year
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="graduationYear"
                                    name="graduationYear"
                                    min="1950"
                                    max="2030"
                                    placeholder="e.g. 2024">

                            </div>


                            <!-- Department -->
                            <div class="mb-3">

                                <label for="department" class="form-label">
                                    Department
                                </label>

                                <select
                                    class="form-select"
                                    id="department"
                                    name="department">

                                    <option value="">
                                        Select Department
                                    </option>

                                    <option value="computer-science">
                                        Computer Science
                                    </option>

                                    <option value="software-engineering">
                                        Software Engineering
                                    </option>

                                    <option value="electrical-engineering">
                                        Electrical Engineering
                                    </option>

                                    <option value="business-administration">
                                        Business Administration
                                    </option>

                                </select>

                            </div>


                            <!-- Gender -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Gender
                                </label>

                                <div>

                                    <div class="form-check form-check-inline">

                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            id="male"
                                            name="gender"
                                            value="male">

                                        <label
                                            class="form-check-label"
                                            for="male">
                                            Male
                                        </label>

                                    </div>


                                    <div class="form-check form-check-inline">

                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            id="female"
                                            name="gender"
                                            value="female">

                                        <label
                                            class="form-check-label"
                                            for="female">
                                            Female
                                        </label>

                                    </div>


                                    <div class="form-check form-check-inline">

                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            id="other"
                                            name="gender"
                                            value="other">

                                        <label
                                            class="form-check-label"
                                            for="other">
                                            Other
                                        </label>

                                    </div>

                                </div>

                            </div>


                            <!-- City -->
                            <div class="mb-3">

                                <label for="city" class="form-label">
                                    City
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="city"
                                    name="city"
                                    placeholder="Enter your city">

                            </div>


                            <!-- Terms and Conditions -->
                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="terms"
                                    name="terms"
                                    required>

                                <label
                                    class="form-check-label"
                                    for="terms">
                                    I agree to the terms and conditions.
                                </label>

                            </div>


                            <!-- Buttons -->
                            <div class="d-grid gap-2 d-md-flex">

                                <button
                                    type="submit"
                                    class="btn btn-dark flex-fill">
                                    Create Account
                                </button>

                                <button
                                    type="reset"
                                    class="btn btn-outline-secondary flex-fill">
                                    Clear Form
                                </button>

                            </div>

                        </form>


                        <!-- Login Link -->
                        <p class="text-center mt-4 mb-0">

                            Already have an account?

                            <a href="login.html">
                                Login here
                            </a>

                        </p>

                    </div>

                </section>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">

        <p class="mb-0">
            &copy; 2026 Alumni Management System
        </p>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>

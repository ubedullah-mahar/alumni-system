<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alumni Registration - AlumniConnect</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="header-container">
            <h1>AlumniConnect</h1>
            <p>Alumni Management System</p>
        </div>
    </header>


    <!-- Navigation -->
    <nav class="navbar">

        <div class="nav-container">

            <div class="logo">
                AlumniConnect
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Dashboard</a>
                </li>

                <li>
                    <a href="alumni.html">Alumni</a>
                </li>

                <li>
                    <a href="profile.html">Profile</a>
                </li>

                <li>
                    <a href="register.html">Register</a>
                </li>

            </ul>

        </div>

    </nav>


    <!-- Main Content -->
    <main class="main-container">

        <section class="form-container">

            <h2>Alumni Registration</h2>

            <p>
                Register your information to become part of our
                alumni community.
            </p>


            <!-- Registration Form -->
            <form>

                <!-- Full Name -->
                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required>

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required>

                </div>


                <!-- Batch -->
                <div class="form-group">

                    <label for="batch">
                        Batch
                    </label>

                    <input
                        type="number"
                        id="batch"
                        name="batch"
                        min="1950"
                        max="2030"
                        placeholder="Enter your graduation year"
                        required>

                </div>


                <!-- Department -->
                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <select
                        id="department"
                        name="department"
                        required>

                        <option value="">
                            Select Department
                        </option>

                        <option value="computer-science">
                            Computer Science
                        </option>

                        <option value="software-engineering">
                            Software Engineering
                        </option>

                        <option value="information-technology">
                            Information Technology
                        </option>

                    </select>

                </div>


                <!-- Current Organization -->
                <div class="form-group">

                    <label for="organization">
                        Current Organization
                    </label>

                    <input
                        type="text"
                        id="organization"
                        name="organization"
                        placeholder="Enter your current organization"
                        required>

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="register-button">

                    Register

                </button>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 AlumniConnect. All rights reserved.
        </p>

    </footer>

</body>

</html>
